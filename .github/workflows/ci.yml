name: CI

# Runs on every push and pull request to main.
# Stage 1 (test) must pass before stage 2 (build & publish) starts, so a broken
# model or API can never produce a published image.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ #
  # 1. dependency installation + automated tests
  # ------------------------------------------------------------------ #
  test:
    name: Pytest (preprocessing + inference)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The CPU wheel index keeps torch at ~200 MB instead of ~2.5 GB,
        # which turns a ~6 minute install into well under a minute.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-api.txt -r requirements-dev.txt

      - name: Show environment
        run: |
          python --version
          python -c "import torch, torchvision; print('torch', torch.__version__, '| torchvision', torchvision.__version__)"

      - name: Verify the model artifact is present
        # The image cannot be built without it, so fail early and clearly.
        run: |
          test -f artifacts/model.pt || { echo "::error::artifacts/model.pt missing - run 'python train.py' and commit it"; exit 1; }
          python -c "import torch; c=torch.load('artifacts/model.pt', map_location='cpu', weights_only=False); print('classes:', c['classes']); print('run_id:', c.get('mlflow_run_id')); print('metrics:', c.get('metrics'))"

      - name: Run tests
        run: python -m pytest -v --tb=short

  # ------------------------------------------------------------------ #
  # 2. build the Docker image and publish it to GHCR
  # ------------------------------------------------------------------ #
  build-and-push:
    name: Build & publish image
    runs-on: ubuntu-latest
    needs: test                       # gate: no green tests, no image
    permissions:
      contents: read
      packages: write                 # required to push to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # GITHUB_TOKEN is provided automatically - no manual secret needed.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build image and load it locally for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                  # keep it local first, do not push yet
          tags: cats-dogs-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a sample image for the smoke test
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.new('RGB', (300, 300), (120, 140, 160)).save('sample.jpg')"

      - name: Smoke test the built image
        # Proves the image actually serves before it is published.
        run: |
          set -e
          docker run -d --name api -p 8000:8000 cats-dogs-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            echo "waiting for API ($i/30)..."
            sleep 2
          done
          echo "--- /health ---"
          curl -fs http://localhost:8000/health | tee health.json
          grep -q '"status":"ok"' health.json
          echo "--- /predict ---"
          curl -fs -F "file=@sample.jpg" http://localhost:8000/predict | tee predict.json
          grep -q 'predicted_label' predict.json
          docker logs api
          docker rm -f api

      - name: Push image to GHCR
        # Only reached when the image passed its smoke test.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Published image tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
